# Fly.io configuration for Emma Jane Photography.
#
# `app` must match the app you created in Fly (`fly apps list`). If it differs, change it here —
# or run `fly launch --no-deploy` once and let Fly rewrite this file.
app = "emmajanephotography"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # SITE_URL = "https://emmajanephoto.com"   # set once the custom domain is attached

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
