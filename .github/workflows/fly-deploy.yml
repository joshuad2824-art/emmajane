# Deploys to Fly.io on every push to main.
# Needs one repository secret: FLY_API_TOKEN  (create with `fly tokens create deploy -x 999999h`,
# then add it under Settings → Secrets and variables → Actions).
name: Fly Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # One machine, as the handoff specifies (Fly otherwise creates two for redundancy).
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
